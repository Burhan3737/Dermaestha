<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dermestha — Set new password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="icon" href="assets/img/logo-mark.svg">
  <script defer src="assets/js/ui.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-8) var(--sp-4);
    }
    .pw-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface);
      border: var(--border-1);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--shadow-overlay);
    }
    .pw-card__accent {
      height: 4px;
      background: var(--color-primary);
    }
    .pw-card__body {
      padding: 36px 36px 32px;
    }
    .pw-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--color-primary-tint);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--sp-5);
      color: var(--color-primary);
    }
    .pw-field {
      max-width: none;
      margin-bottom: var(--sp-4);
    }
    .pw-field > label {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: var(--fs-caption);
      color: var(--color-text-strong);
      display: block;
      margin-bottom: var(--sp-1);
    }
    @media (max-width: 480px) {
      .pw-card__body { padding: 28px 20px 24px; }
    }
  </style>
</head>
<body>

<!-- Top nav — brand only (no links for forced-change flow) -->
<nav class="topnav">
  <div class="topnav__inner">
    <a class="brand" href="#">
      <span class="brand__mark"></span>
      <span class="brand__word">Dermestha</span>
    </a>
  </div>
</nav>

<div class="auth-body">
  <div class="pw-card">
    <div class="pw-card__accent"></div>
    <div class="pw-card__body">

      <!-- Lock icon header -->
      <div class="pw-icon-wrap" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>

      <h1 class="h1" style="text-align:center;margin-bottom:var(--sp-2)">Set a new password</h1>
      <p class="muted" style="text-align:center;font-size:var(--fs-body-sm);margin-bottom:var(--sp-6);line-height:1.6">
        For your security, please choose a new password before continuing to your panel.
      </p>

      <form onsubmit="event.preventDefault(); location.href='doctor-02-today.html'">

        <div class="field pw-field">
          <label for="pw-current">Current password</label>
          <input id="pw-current" type="password" class="input" placeholder="Enter your current password" autocomplete="current-password">
        </div>

        <div class="field pw-field">
          <label for="pw-new">New password</label>
          <input id="pw-new" type="password" class="input" placeholder="At least 8 characters" autocomplete="new-password">
          <p class="help">Use a mix of letters, numbers, and symbols.</p>
        </div>

        <div class="field pw-field">
          <label for="pw-confirm">Confirm new password</label>
          <input id="pw-confirm" type="password" class="input" placeholder="Re-enter new password" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" style="margin-top:var(--sp-2)">
          Update &amp; continue
        </button>

        <p class="help" style="text-align:center;margin-top:var(--sp-4)">
          You won't be able to access your panel until this is done.
        </p>

      </form>
    </div>
  </div>
</div>

</body>
</html>
